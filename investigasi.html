<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyelidikan - Misteri Ikan Hilang</title>
    <link rel="stylesheet" href="investigasi.css">
</head>

<body>
    <div class="halaman">

        <header>
            <div class="logo">🔎 MISTERI IKAN HILANG</div>

            <div class="status">
                ❤️ ❤️ ❤️
                <span>⏱️ 60</span>
            </div>
        </header>

        <main>

            <div class="judul">
                <p class="label">CASE #001</p>
                <h1>🐟 Siapa yang Mencuri Ikan?</h1>

                <p>
                    Ikan terakhir di rumah menghilang secara misterius.
                    <br>
                    Empat kucing berada di rumah saat kejadian.
                </p>
            </div>

            <h2>🔎 DAFTAR TERSANGKA</h2>

            <div class="tersangka">

                <button onclick="pilihTersangka('Mochi')">
                    <img src="gambar/mochi.jpg" alt="Mochi">
                    <strong>Mochi</strong>
                    <small>TERSANGKA #01</small>
                </button>

                <button onclick="pilihTersangka('Milo')">
                    <img src="gambar/milo.jpg" alt="Milo">
                    <strong>Milo</strong>
                    <small>TERSANGKA #02</small>
                </button>

                <button onclick="pilihTersangka('Mimi')">
                    <img src="gambar/mimi.jpg" alt="Mimi">
                    <strong>Mimi</strong>
                    <small>TERSANGKA #03</small>
                </button>

                <button onclick="pilihTersangka('Momo')">
                    <img src="gambar/momo.jpg" alt="Momo">
                    <strong>Momo</strong> 
                    <small>TERSANGKA #04</small>
                </button>

            </div>
            
            <p id="pesan"></p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
